# ==============================================================
# Laksana POS - Konfigurasi Nginx Produksi (Super Aman)
# Salin file ini ke: /etc/nginx/sites-available/laksana-pos.conf
# ==============================================================

server {
    listen 80;
    listen [::]:80;
    
    # Ganti dengan nama domain atau IP server Anda
    server_name pos.domainanda.com;

    # Ganti path ini sesuai lokasi folder proyek di server Anda
    set $root_path /var/www/Laksana-POS-APPS;

    # ==========================================================
    # 1. SECURITY HEADERS (Lolos Uji Nuclei & OWASP Top 10)
    # ==========================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Nonaktifkan informasi versi Nginx
    server_tokens off;

    # Ukuran maksimal upload gambar produk/struk (10 MB)
    client_max_body_size 10M;

    # ==========================================================
    # 2. FRONTEND (Hasil Build Vite React)
    # ==========================================================
    root $root_path/apps/admin-dashboard/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ==========================================================
    # 3. BACKEND API (PHP API)
    # ==========================================================
    location /api {
        root $root_path/apps/api/public;
        try_files $uri $uri/ /index.php?$query_string;

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $root_path/apps/api/public/index.php;
            
            # Cek socket PHP-FPM di server Anda (sesuaikan versi: php8.1, php8.2, php8.3)
            fastcgi_pass unix:/var/run/php/php-fpm.sock;
            # Atau jika menggunakan port:
            # fastcgi_pass 127.0.0.1:9000;
            
            fastcgi_index index.php;
            fastcgi_read_timeout 60;
        }
    }

    # ==========================================================
    # 4. MEDIA UPLOADS & RECEIPTS (Aman: Nonaktifkan Eksekusi Script)
    # ==========================================================
    location /uploads/ {
        alias $root_path/apps/api/public/uploads/;
        # Blokir total jika ada yang mencoba menjalankan script PHP di folder upload
        location ~ \.(php|phtml|php3|php4|php5|php7|phps|cgi|pl|sh)$ {
            deny all;
        }
    }

    location /storage/ {
        alias $root_path/apps/api/public/storage/;
        location ~ \.(php|phtml|php3|php4|php5|php7|phps|cgi|pl|sh)$ {
            deny all;
        }
    }

    # ==========================================================
    # 5. BLOKIR AKSES KE FILE SENSITIF & TERSEMBUNYI (.env, .git, dll)
    # ==========================================================
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(sql|json|lock|md|bat|sh|yaml|yml)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ==========================================================
    # 6. GZIP COMPRESSION (Agar Web Sangat Cepat)
    # ==========================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;
}
