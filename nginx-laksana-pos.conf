# ==============================================================
# Laksana POS - Konfigurasi Nginx Produksi (Super Aman)
# Salin file ini ke: /etc/nginx/sites-available/laksana-pos.conf
# ==============================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    
    server_name _ poslaksana.my.id;

    # Lokasi folder proyek di server Anda
    set $root_path /home/fikri/Laksana-POS-APPS;

    # ==========================================================
    # 1. SECURITY HEADERS (Lolos Uji Nuclei & OWASP Top 10)
    # ==========================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' https://fonts.googleapis.com https://fonts.gstatic.com https://static.cloudflareinsights.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://static.cloudflareinsights.com; img-src 'self' data: https: blob:; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' https:;" always;

    # Nonaktifkan informasi versi Nginx
    server_tokens off;

    # Ukuran maksimal upload gambar produk/struk (10 MB)
    client_max_body_size 10M;

    # ==========================================================
    # 2. FRONTEND (Hasil Build Vite React)
    # ==========================================================
    root $root_path/apps/admin-dashboard/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ==========================================================
    # 3. BACKEND API (PHP API)
    # ==========================================================
    location ^~ /api {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $root_path/apps/api/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param DOCUMENT_URI $document_uri;
        
        # Socket PHP 8.3 FPM
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 60;
    }

    # ==========================================================
    # 4. MEDIA UPLOADS & RECEIPTS (Aman: Nonaktifkan Eksekusi Script)
    # ==========================================================
    location /uploads/ {
        alias $root_path/apps/api/public/uploads/;
        # Blokir total jika ada yang mencoba menjalankan script PHP di folder upload
        location ~ \.(php|phtml|php3|php4|php5|php7|phps|cgi|pl|sh)$ {
            deny all;
        }
    }

    location /storage/ {
        alias $root_path/apps/api/public/storage/;
        location ~ \.(php|phtml|php3|php4|php5|php7|phps|cgi|pl|sh)$ {
            deny all;
        }
    }

    # ==========================================================
    # 5. BLOKIR AKSES KE FILE SENSITIF & TERSEMBUNYI (.env, .git, dll)
    # ==========================================================
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(sql|json|lock|md|bat|sh|yaml|yml)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ==========================================================
    # 6. GZIP COMPRESSION (Agar Web Sangat Cepat)
    # ==========================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;
}
