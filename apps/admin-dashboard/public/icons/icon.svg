<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.35" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#grad)" />
  <g filter="url(#shadow)">
    <!-- Receipt Paper -->
    <rect x="180" y="70" width="70" height="70" rx="8" fill="#f8fafc" />
    <line x1="195" y1="88" x2="235" y2="88" stroke="#6366f1" stroke-width="4" stroke-linecap="round" />
    <line x1="195" y1="102" x2="225" y2="102" stroke="#6366f1" stroke-width="4" stroke-linecap="round" />
    <line x1="195" y1="116" x2="230" y2="116" stroke="#6366f1" stroke-width="4" stroke-linecap="round" />

    <!-- POS Machine Upper Display -->
    <rect x="140" y="130" width="232" height="100" rx="20" fill="#ffffff" />
    <rect x="166" y="150" width="180" height="60" rx="10" fill="#0f172a" />
    <rect x="184" y="172" width="100" height="16" rx="4" fill="#34d399" />
    <circle cx="320" cy="180" r="8" fill="#38bdf8" />

    <!-- POS Machine Base Body -->
    <rect x="110" y="220" width="292" height="190" rx="24" fill="#ffffff" />

    <!-- Keypad Keys -->
    <g fill="#cbd5e1">
      <rect x="140" y="246" width="46" height="30" rx="8" />
      <rect x="198" y="246" width="46" height="30" rx="8" />
      <rect x="256" y="246" width="46" height="30" rx="8" />
      <rect x="140" y="290" width="46" height="30" rx="8" />
      <rect x="198" y="290" width="46" height="30" rx="8" />
      <rect x="256" y="290" width="46" height="30" rx="8" />
      <rect x="140" y="334" width="46" height="30" rx="8" />
      <rect x="198" y="334" width="46" height="30" rx="8" />
      <!-- Action Buttons -->
      <rect x="314" y="246" width="58" height="40" rx="8" fill="#ef4444" />
      <rect x="314" y="298" width="58" height="66" rx="8" fill="#10b981" />
      <!-- Cash Drawer slot -->
      <rect x="140" y="378" width="232" height="10" rx="4" fill="#334155" />
    </g>
  </g>
</svg>